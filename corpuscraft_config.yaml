input_dir: data
parser:
  pipeline: standard
  ocr_engine: rapidocr
  ocr_languages:
  - eng
  vlm_model: gabegoodhart/granite-docling:258M
  vlm_host: http://localhost:11434
  image_scale: 2.0
llm:
  backend: ollama
  model: llama3.1:8b
  base_url: http://localhost:11434
  temperature: 0.7
generators:
- type: qa
  num_examples: 100
exporter:
  format: jsonl
  output_dir: outputs
  split_ratio:
  - 0.8
  - 0.1
  - 0.1
